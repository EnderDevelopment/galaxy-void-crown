    <!-- Galaxy on Back -->
    <circle cx="48" cy="16" r="8" fill="#FFFFFF" />
    <circle cx="48" cy="16" r="4" fill="#0000FF" />
    <circle cx="48" cy="16" r="2" fill="#FFFFFF" />
</svg>