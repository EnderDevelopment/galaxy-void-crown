<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" shape-rendering="crispEdges">
  <!-- Void background -->
  <rect width="64" height="64" fill="#000000" />

  <!-- Galaxy on front -->
  <circle cx="32" cy="32" r="10" fill="#FFFFFF" />
  <circle cx="32" cy="32" r="12" fill="none" stroke="#FFFFFF" stroke-width="1" />
  <circle cx="32" cy="32" r="14" fill="none" stroke="#FFFFFF" stroke-width="1" />
  <circle cx="32" cy="32" r="16" fill="none" stroke="#FFFFFF" stroke-width="1" />

  <!-- Galaxy on back -->
  <circle cx="32" cy="32" r="10" fill="#FFFFFF" transform="translate(0, 32)" />
  <circle cx="32" cy="32" r="12" fill="none" stroke="#FFFFFF" stroke-width="1" transform="translate(0, 32)" />
  <circle cx="32" cy="32" r="14" fill="none" stroke="#FFFFFF" stroke-width="1" transform="translate(0, 32)" />
  <circle cx="32" cy="32" r="16" fill="none" stroke="#FFFFFF" stroke-width="1" transform="translate(0, 32)" />

  <!-- Black crown -->
  <path d="M10 20 L12 18 L14 20 L16 18 L18 20 L20 18 L22 20 L24 18 L26 20 L28 18 L30 20 L32 18 L34 20 L36 18 L38 20 L40 18 L42 20 L44 18 L46 20 L48 18 L50 20 L52 18 L54 20" stroke="#000000" fill="none" stroke-width="2" />
</svg>